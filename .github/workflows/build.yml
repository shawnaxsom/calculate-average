name: Build APK

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk average-debug.apk

      - name: Upload APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: average-debug-apk
          path: average-debug.apk
          if-no-files-found: error

      # Build artifacts are zipped and need a signed-in GitHub account to
      # fetch. Republish the same APK as a rolling "latest" pre-release so the
      # phone doing the sideloading can download the .apk directly.
      - name: Publish to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest average-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Latest debug build" \
            --notes "Debug APK built from $GITHUB_SHA on \`$GITHUB_REF_NAME\`.

          Sideload it: download \`average-debug.apk\` on the phone and open it. Android will ask you to allow installs from your browser or files app the first time. It is debug-signed, so it will not upgrade over a Play Store copy." \
            --prerelease
